name: ci

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GHC_VERSION: "9.10.3"
  ORMOLU_VERSION: "0.9.0.0"
  HLINT_VERSION: "3.10"
  WEEDER_VERSION: "2.11.0"

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
            .hie
            hinsight-tadka/.hie
          key: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-${{ hashFiles('hinsight.cabal', 'hinsight-tadka/hinsight-tadka.cabal', 'cabal.project', 'cabal.project.freeze') }}
          restore-keys: ${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-

      - name: Build with warnings as errors
        run: cabal build all

      - name: Test, including the checks that run a real GHC
        run: cabal test all --test-show-details=direct

      # The ranking benchmark is compared with the plain sort it wraps, so
      # this threshold holds on any machine: fail if ranking is more than 100%
      # slower than sorting the same list.
      - name: Benchmarks
        run: cabal bench --benchmark-options='--stdev 20 --fail-if-slower 100'

      # Weeder fails the build on any dead code. Its first report was empty
      # and a deliberately unused function was reported, so it can be trusted.
      - name: Install weeder
        id: weeder-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/weeder
          key: weeder-${{ env.WEEDER_VERSION }}-ghc-${{ env.GHC_VERSION }}

      - name: Build weeder
        if: steps.weeder-cache.outputs.cache-hit != 'true'
        run: |
          # Run outside the project so its freeze file does not constrain weeder.
          cd "$RUNNER_TEMP"
          cabal install "weeder-$WEEDER_VERSION" --with-compiler="ghc-$GHC_VERSION" \
            --installdir="$HOME/.local/bin" --overwrite-policy=always

      - name: Find dead code with weeder
        run: |
          # With no .hie files weeder finds nothing and passes, which would
          # hide dead code. A fully cached build can leave none behind.
          for dir in .hie hinsight-tadka/.hie; do
            test "$(find "$dir" -name '*.hie' | wc -l)" -gt 0 || { echo "no .hie files in $dir: nothing for weeder to read"; exit 1; }
          done
          "$HOME/.local/bin/weeder" --hie-directory .hie --hie-directory hinsight-tadka/.hie

  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned hlint and ormolu
        run: |
          mkdir -p "$HOME/tools" && cd "$HOME/tools"
          curl -fsSL -o hlint.tgz "https://github.com/ndmitchell/hlint/releases/download/v${HLINT_VERSION}/hlint-${HLINT_VERSION}-x86_64-linux.tar.gz"
          tar xzf hlint.tgz
          curl -fsSL -o ormolu.zip "https://github.com/tweag/ormolu/releases/download/${ORMOLU_VERSION}/ormolu-x86_64-linux.zip"
          unzip -q ormolu.zip && chmod +x ormolu
          echo "$HOME/tools/hlint-${HLINT_VERSION}" >> "$GITHUB_PATH"
          echo "$HOME/tools" >> "$GITHUB_PATH"

      - name: HLint (bans from the engineering standard are errors)
        run: hlint src test bench app toolchain hinsight-tadka

      - name: "Ormolu (fixtures excluded because their line numbers are asserted)"
        run: ormolu --mode check $(find src test bench app toolchain hinsight-tadka -name '*.hs' -not -path 'test/fixtures/*')

  independence:
    name: package independence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No mention of the application that uses this package
        run: |
          if grep -rIl --ignore-case --exclude-dir=.git --exclude-dir=dist-newstyle "ras[i]ka" .; then
            echo "this package must not mention the application that uses it"; exit 1
          fi
