name: musl spike

# Run by hand from the Actions tab. It does not run on a push or a pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  musl:
    name: link the ghc library on musl
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run the link spike on Alpine
        shell: bash
        run: sh scripts/spike-musl.sh 2>&1 | tee spike-musl.out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-musl
          path: spike-musl.out
          if-no-files-found: warn
